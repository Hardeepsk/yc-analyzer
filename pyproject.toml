[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yc-analyzer"
version = "0.1.0"
description = "Y Combinator Startup Analyzer - Data pipeline, ML predictions, and alpha insights"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.1",
    "polars>=0.20",
    "duckdb>=0.10",
    "sqlalchemy>=2.0",
    "httpx>=0.25",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "tqdm>=4.66",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
    "pre-commit>=3.6",
]
ml = [
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "lightgbm>=4.1",
    "lifelines>=0.28",
    "shap>=0.43",
    "optuna>=3.4",
]
api = [
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "pydantic>=2.5",
]
dashboard = [
    "streamlit>=1.28",
    "plotly>=5.17",
    "altair>=5.2",
]
enrichment = [
    "crunchbase-api>=0.1",  # if available
    "linkedin-api>=0.1",    # placeholder
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["S101", "T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["src"]